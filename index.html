*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#2b1a6b linear-gradient(160deg,#0c1d6b 0%,#2f1b82 45%,#6d1f93 75%,#b8208a 100%) fixed;color:var(--ink);font:17px/1.55 Inter,system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px}

.card{padding:14px 0;margin:12px 0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;background:var(--card);color:var(--ink);padding:10px 16px;border-radius:12px}
button:hover{border-color:var(--ac)}button.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
button.main{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:600}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
.mut{color:var(--mut)}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
#stage{width:100%;height:380px;border-radius:12px;background:radial-gradient(circle at 50% 30%,#8a35c9,#2e1d8a 55%,#101a5c)}
.cam{position:relative;width:100%;aspect-ratio:4/3;background:#12154f;border-radius:12px;overflow:hidden}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);object-fit:cover}
.bar{height:26px;background:var(--line);border-radius:14px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e);transition:width .12s}
.bar b{position:absolute;left:80%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.steps span{padding:4px 10px;border-radius:99px;font-size:13px}
.steps .on{background:var(--ac);color:#fff;border-color:var(--ac)}.steps .done{border-color:#22c55e;color:#22c55e}
input[type=text]{font:inherit;padding:10px;border-radius:12px;border:0;background:rgba(10,14,70,.55);color:var(--ink);width:100%}
a{color:#f5b3f0}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hs{display:flex;gap:10px;overflow-x:auto;padding:8px 2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.hs button{flex:0 0 auto;scroll-snap-align:start;white-space:nowrap}#rest[hidden]{display:none}#ls,#vs{scroll-snap-type:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%)}.hs{scrollbar-width:thin;padding:10px 4px 14px}.sq{border:1px solid var(--line);width:190px;height:190px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:4px;text-align:left;white-space:normal!important;padding:16px;border-radius:20px;position:relative;background:linear-gradient(160deg,rgba(90,70,210,.55),rgba(190,40,140,.35));transition:transform .15s,box-shadow .15s}.sq:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.35)}.sq .em{font-size:44px;line-height:1;margin-bottom:auto}.sq b{font-size:19px}.sq small{opacity:.85;font-size:13px;line-height:1.3}.sq.sel{background:linear-gradient(160deg,#8b5cf6,#ec4899);border-color:#fff}.sq .rec{position:absolute;top:12px;right:12px;font-style:normal;font-size:11px;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:99px}

.sq.vc img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.sq.vc b{font-size:14px;line-height:1.3;padding:8px 10px}
h1,h2,h3,.sq b,.section-title{font-family:Georgia,"Times New Roman",serif}
button:disabled{opacity:.45;cursor:default}

function quiz(){const k=seq()[qi],q=Q[k],tot=seq().length;let h=`<h1 class="grad">Dance Spire 💃</h1><p class="mut">Answer a few quick questions and we’ll find your dancer type.</p><div class="card"><div class="prog"><i style="width:${qi/tot*100}%"></i></div><h2>${q.t}</h2><div class="opts" id="o"></div></div>`;app.innerHTML=h;const o=document.getElementById('o');
if(q.s){for(let i=1;i<=10;i++)o.append(btn(i,()=>ans(k,i)))}
else if(q.m){const sel=new Set();q.o.forEach(x=>{const b=btn(x,()=>{sel.has(x)?sel.delete(x):sel.add(x);b.classList.toggle('sel')});o.append(b)});const c=btn("Continue →",()=>ans(k,[...sel]));c.className='main';o.append(c)}
else q.o.forEach(([v,l])=>o.append(btn(l,()=>ans(k,v))))}
function btn(t,f){const b=document.createElement('button');b.textContent=t;b.onclick=f;return b}
function ans(k,v){A[k]=v;qi++;qi>=seq().length?result():quiz()}
function recommend(){const s={flow:0,hiphop:0,latin:0,party:0,ballet:0,jazz:0,bollywood:0,chinese:0};(A.styles||[]).forEach(x=>{if(SM[x])s[SM[x]]+=2});
if(A.exp==='none'){const f=A.flex,c=A.coord;if(A.tempo==='fast')s[c>=6?'hiphop':'party']+=2;else if(A.tempo==='slow')s[f>=6?'ballet':'chinese']+=2;else{s.bollywood+=2;s.latin++;s.jazz++}}
else{if(A.tempo==='fast'){s.hiphop++;s.party++}if(A.tempo==='slow'){s.flow++;s.latin++}}
if(A.goal==='social'){s.party++;s.latin++}if(A.goal==='fit'){s.hiphop++}if(A.goal==='perform'){s.flow++;s.jazz++}
return Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0]}
function result(){const id=recommend(),lv={none:"Beginner",some:"Intermediate",lots:"Advanced"}[A.exp];A.pick=id;

let phase='manual', selectedVideo='', generation=0, photoAdvanceTimer, capture, referenceModel, player, apiPromise, poseScript;
const control=()=>document.getElementById('practiceControls');
function stopPractice(){
  clearLocalClip();
  generation++;
  clearTimeout(photoAdvanceTimer);
  capture?.getTracks().forEach(track=>track.stop()); capture=null;
  if(referenceModel){const model=referenceModel; referenceModel=null;Promise.resolve(model.close()).catch(()=>{})}
  if(player){player.destroy();player=null}
  if(control())control().replaceChildren();
}
let replayStart=null;
function setManualControls(enabled){
  document.getElementById('poseControls').hidden=!enabled;
  document.getElementById('mm').hidden=!enabled || phase==='ready';
}
function replayPose(){
  if(phase==='ready'){beginTutorial();si=3;show()}
  cur=A0();hold=0;replayStart=performance.now();
}
function beginTutorial(){
  phase='manual';setManualControls(true);si=0;best=[];show();
  document.getElementById('sum').replaceChildren();
  control().textContent='Follow each pose at your own pace. Hold a camera match, check a photo, or choose “I matched it” or “Next” when ready.';
}
let figureMode='tutorial',savedClip=null;
function updateMode(mode){
  figureMode=mode;
  document.getElementById('modeSwitch').hidden=!selectedVideo;
  document.getElementById('tutorialMode').setAttribute('aria-pressed',String(mode==='tutorial'));
  document.getElementById('videoMode').setAttribute('aria-pressed',String(mode==='video'));
}
function canSharePlayer(){return !!(window.CropTarget && navigator.mediaDevices?.getDisplayMedia && window.BrowserCaptureMediaStreamTrack?.prototype.cropTo)}
function practiceReady(message){
  phase='ready';setManualControls(false);const share=canSharePlayer();
  const hint=share?'':' Choose a video file of the selected dance for the 30-second match.';
  control().replaceChildren(document.createTextNode(message+hint+' '));
  if(share)control().append(btn('Match video by sharing this tab',startPractice));
  if(savedClip)control().append(btn('Replay clip',()=>openClip(savedClip)));
  control().append(btn('Choose dance video file',chooseClip));
}
function youtubeAPI(){
  if(window.YT?.Player)return Promise.resolve();
  if(!apiPromise)apiPromise=new Promise((resolve,reject)=>{
    const timer=setTimeout(()=>reject(Error('YouTube player timed out.')),12000);
    window.onYouTubeIframeAPIReady=()=>{clearTimeout(timer);resolve()};
    ld('https://www.youtube.com/iframe_api').catch(reject);
  }).catch(error=>{apiPromise=null;throw error});
  return apiPromise;
}
function poseLibrary(){
  if(window.Pose)return Promise.resolve();
  if(!poseScript)poseScript=ld(BASE+'pose.js').catch(error=>{poseScript=null;throw error});
  return poseScript;
}
async function referenceTracker(feed,current){
    const model=new Pose({locateFile:file=>BASE+file});referenceModel=model;
    model.setOptions({modelComplexity:0,smoothLandmarks:true});
    let seen=false;
    model.onResults(result=>{
      if(!current())return;
      const points=result.poseLandmarks;
      seen=!!points && M.filter(([a,b])=>Math.min(points[a].visibility,points[b].visibility)>.45).length>=5;
      if(!seen){tgt=A0();return}
      tgt=M.map(([a,b,i])=>Math.min(points[a].visibility,points[b].visibility)<.45?tgt[i]:
        Math.atan2(-(points[b].x-points[a].x)*feed.videoWidth,(points[b].y-points[a].y)*feed.videoHeight)*180/Math.PI);
    });
    await model.initialize();
    return {model, visible:()=>seen};
}
let localVideo, localUrl;
function clearLocalClip(){
  if(localVideo){localVideo.pause();localVideo.removeAttribute('src');localVideo.load();localVideo.remove();localVideo=null}
  if(localUrl){URL.revokeObjectURL(localUrl);localUrl=null}
}
function chooseClip(){
  const input=document.createElement('input');
  input.type='file';input.accept='video/*';
  const version=generation;
  input.onchange=()=>{if(version===generation && input.files[0])openClip(input.files[0])};
  input.click();
}
function openClip(file){
  savedClip=file;
  stopPractice();phase='clip';setManualControls(false);
  const version=generation, current=()=>version===generation;
  const id=selectedVideo;
  const finish=message=>{
    if(!current())return;
    playV(id,message);
  };
  const video=document.createElement('video');localVideo=video;
  video.controls=true;video.playsInline=true;video.style.width='100%';
  localUrl=URL.createObjectURL(file);video.src=localUrl;
  document.getElementById('vf').replaceChildren(video);
  video.onerror=()=>finish('This file could not play. Try another video file.');
  const match=btn('Start matching',async()=>{
    if(!current() || match.disabled)return;
    match.disabled=true;phase='starting';video.pause();
    const start=0;
    video.currentTime=start;
    try{
      notice.textContent='Loading pose tracking… ';
      await poseLibrary();if(!current())return;
      const {model,visible}=await referenceTracker(video,current);if(!current())return;
      phase='practice';video.controls=true;
      document.getElementById('st').replaceChildren();
      document.getElementById('sn').textContent='Follow the video';
      document.getElementById('sd').textContent=file.name;
      await video.play().catch(()=>{});
      while(current()){
        const elapsed=video.currentTime-start;
        if(video.ended || elapsed>=30){finish('Practice complete.');return}
        notice.textContent=Math.max(0,Math.floor(elapsed))+' / '+Math.ceil(Math.min(30,video.duration-start))+' s · '+(video.paused?'Press play on the clip.':visible()?'Follow the dancer.':'Looking for a dancer.');
        if(!video.paused && video.readyState>=2)await model.send({image:video});
        await new Promise(resolve=>setTimeout(resolve,40));
      }
    }catch(error){finish('Tracking could not continue. Check your connection and try a playable clip.')}
  });
  const notice=document.createElement('span');
  notice.textContent='Match the first 30 seconds of this clip. ';
  match.disabled=true;video.onloadedmetadata=()=>{match.disabled=!Number.isFinite(video.duration)};
  control().replaceChildren(notice,match,btn('Cancel',()=>finish('Practice stopped.')));
}
async function startPractice(){
  if(!window.CropTarget || !navigator.mediaDevices?.getDisplayMedia){
    chooseClip();return;
  }
  phase='starting';setManualControls(false);const version=++generation;
  const current=()=>version===generation;
  const frame=document.querySelector('#vf iframe');
  const reset=message=>{
    if(!current())return;
    const id=selectedVideo;playV(id,message);
  };
  control().replaceChildren(document.createTextNode('Choose this Dance Spire tab to track the video. '),btn('Cancel',()=>reset('Practice stopped.')));
  try{
    const media=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false,preferCurrentTab:true,selfBrowserSurface:'include'});
    if(!current()){media.getTracks().forEach(t=>t.stop());return}
    capture=media;const track=media.getVideoTracks()[0];
    track.onended=()=>reset('Tab sharing ended.');
    if(!track.cropTo)throw Error('Tab cropping is unavailable.');
    await track.cropTo(await CropTarget.fromElement(frame));
    await Promise.all([youtubeAPI(),poseLibrary()]);
    if(!current())return;
    const feed=document.createElement('video');feed.muted=true;feed.playsInline=true;feed.srcObject=media;await feed.play();
    if(!current())return;
    const {model,visible}=await referenceTracker(feed,current);
    if(!current())return;
    await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(Error('Video player timed out.')),15000);
      player=new YT.Player(frame,{events:{onReady:()=>{clearTimeout(timer);resolve()},onError:()=>{clearTimeout(timer);reject(Error('Video unavailable.'));reset('This video could not play here. Choose another dance.')}}});
    });
    if(!current())return;
    const start=0;
    player.seekTo(start,true);player.playVideo();phase='practice';
    document.getElementById('st').replaceChildren();
    document.getElementById('sn').textContent='Follow the video';
    document.getElementById('sd').textContent='The figure follows the clearest dancer visible in the player.';
    const status=document.createElement('span');
    control().replaceChildren(status,btn('Stop',()=>reset('Practice stopped.')));
    while(current()){
      const elapsed=Math.max(0,player.getCurrentTime()-start);
      if(elapsed>=30 || player.getPlayerState()===0){reset('Practice complete.');return}
      const playing=player.getPlayerState()===1;
      status.textContent=Math.floor(elapsed)+' / 30 s · '+(!playing?'Press play in the video.':visible()?'Follow the dancer.':'Looking for a visible dancer.');
      if(playing && feed.readyState>=2)await model.send({image:feed});
      await new Promise(resolve=>setTimeout(resolve,40));
    }
  }catch(error){reset('Matching could not start or continue. Select this tab when sharing and allow the video to play.')}
}

function mountVideo(id){document.querySelectorAll('#vs button').forEach(x=>x.classList.toggle('sel',x.dataset.id===id));

function playV(id,message=''){
  stopPractice();if(selectedVideo!==id)savedClip=null;
  selectedVideo=id;mountVideo(id);updateMode('video');
  replayStart=null;cur=A0();tgt=A0();
  for(const key of ['sum','st','sd'])document.getElementById(key).replaceChildren();
  document.getElementById('sn').textContent='Video practice · first 30 seconds';
  practiceReady(message);
  if(!message){if(savedClip)openClip(savedClip);else if(canSharePlayer())startPractice()}
}
function addYT(){const i=document.getElementById('yt'),m=i.value.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);if(!m){i.value='';i.placeholder='That doesn’t look like a YouTube link';return}

function A0(){return [-8,-5,8,5,-4,-2,4,2]}
function show(){replayStart=null;document.getElementById('pv').disabled=si===0;document.getElementById('nx').textContent=si===3?'Finish tutorial':'Next →';clearTimeout(photoAdvanceTimer);score=0;document.getElementById('fill').style.width='0%';document.getElementById('pc').textContent='0%';const s=R[rid].steps.slice(0,4);tgt=s[si][2];hold=0;

function go(d){if(phase==='ready'){beginTutorial();if(d<0){si=3;show()}return}if(phase!=='manual')return;const n=4;if(si+d>=n){finish();return}si=Math.max(0,si+d);show()}
function finish(){const v=R[rid].steps.slice(0,4).map((_,i)=>best[i]||0),av=Math.round(v.reduce((a,b)=>a+b,0)/v.length*100);

const L={ua:.55,fa:.5,th:.75,sh:.75},SW=.38,HW=.2;
function initThree(){try{init3()}catch(e){init2d()}}
function init2d(){use2d=true;const el=document.getElementById('stage');el.innerHTML='<canvas style="width:100%;height:100%"></canvas>';c2=el.firstChild;c2.width=Math.max(300,el.clientWidth)*2;c2.height=Math.max(300,el.clientHeight)*2}
function draw2d(a,t){const c=c2.getContext('2d'),W=c2.width,H=c2.height;c.clearRect(0,0,W,H);const bob=Math.sin(t*3)*.02,S=H/4.3,ox=W/2,oy=H*.5;const X=p=>ox+p[0]*S,Y=p=>oy-p[1]*S;
const pel=[0,bob],ne=[0,1+bob],ls=[-SW/2,ne[1]-.05],rs=[SW/2,ne[1]-.05],lh=[-HW,bob],rh=[HW,bob];const le=pt(ls,L.ua,a[0]),lw=pt(le,L.fa,a[1]),re=pt(rs,L.ua,a[2]),rw=pt(re,L.fa,a[3]),lk=pt(lh,L.th,a[4]),la=pt(lk,L.sh,a[5]),rk=pt(rh,L.th,a[6]),ra=pt(rk,L.sh,a[7]);
c.lineCap='round';c.lineWidth=S*.2;const seg=(p,q,col)=>{c.strokeStyle=col;c.beginPath();c.moveTo(X(p),Y(p));c.lineTo(X(q),Y(q));c.stroke()};const P='#8b5cf6',K='#ec4899';
seg(pel,ne,P);seg(ls,rs,P);seg(lh,rh,P);seg(ls,le,P);seg(le,lw,P);seg(rs,re,K);seg(re,rw,K);seg(lh,lk,P);seg(lk,la,P);seg(rh,rk,K);seg(rk,ra,K);
c.fillStyle=K;c.beginPath();c.arc(ox,Y([0,ne[1]+.3]),S*.24,0,7);c.fill();c.fillStyle='rgba(255,255,255,.15)';c.beginPath();c.ellipse(ox,oy+1.55*S,S*1.2,S*.18,0,0,7);c.fill()}
function init3(){const el=document.getElementById('stage');scene=new THREE.Scene();ren=new THREE.WebGLRenderer({antialias:true,alpha:true});ren.setSize(el.clientWidth,el.clientHeight);el.append(ren.domElement);
cam=new THREE.PerspectiveCamera(40,el.clientWidth/el.clientHeight,.1,50);scene.add(new THREE.AmbientLight(0xffffff,.7));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(2,4,5);scene.add(dl);
const gm=new THREE.MeshStandardMaterial({color:0xec4899}),bm=new THREE.MeshStandardMaterial({color:0x8b5cf6});
['lua','lfa','rua','rfa','lth','lsh','rth','rsh','torso'].forEach(k=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,1,14),k==='torso'?bm:(k[0]==='l'?bm:gm));if(k==='torso')m.geometry=new THREE.CylinderGeometry(.2,.17,1,16);scene.add(m);bones[k]=m});
['ls','le','lw','rs','re','rw','lh','lk','la','rh','rk','ra'].forEach(k=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.11,16,12),gm);scene.add(m);joints[k]=m});
joints.head=new THREE.Mesh(new THREE.SphereGeometry(.24,20,16),gm);scene.add(joints.head);
const fl=new THREE.Mesh(new THREE.CircleGeometry(1.6,40),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.12}));fl.rotation.x=-Math.PI/2;fl.position.y=-1.55;scene.add(fl)}
function bone(m,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];m.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,0);m.scale.y=Math.hypot(dx,dy);m.rotation.z=Math.atan2(-dx,dy)}
const pt=(p,len,deg)=>[p[0]+len*Math.sin(deg*Math.PI/180),p[1]-len*Math.cos(deg*Math.PI/180)];
function draw(a,t){if(use2d)return draw2d(a,t);const bob=Math.sin(t*3)*.02,pel=[0,bob],ne=[0,1+bob],ls=[-SW/2,ne[1]-.05],rs=[SW/2,ne[1]-.05],lh=[-HW,bob],rh=[HW,bob];
const le=pt(ls,L.ua,a[0]),lw=pt(le,L.fa,a[1]),re=pt(rs,L.ua,a[2]),rw=pt(re,L.fa,a[3]),lk=pt(lh,L.th,a[4]),la=pt(lk,L.sh,a[5]),rk=pt(rh,L.th,a[6]),ra=pt(rk,L.sh,a[7]);
bone(bones.lua,ls,le);bone(bones.lfa,le,lw);bone(bones.rua,rs,re);bone(bones.rfa,re,rw);bone(bones.lth,lh,lk);bone(bones.lsh,lk,la);bone(bones.rth,rh,rk);bone(bones.rsh,rk,ra);bone(bones.torso,pel,ne);
const J={ls,le,lw,rs,re,rw,lh,lk,la,rh,rk,ra};for(const k in J)joints[k].position.set(J[k][0],J[k][1],0);joints.head.position.set(0,ne[1]+.3,0);
const ang=Math.sin(t*.5)*.45;cam.position.set(Math.sin(ang)*6,.9,Math.cos(ang)*6);cam.lookAt(0,.2,0);ren.render(scene,cam)}
let t0=performance.now();
function anim(){requestAnimationFrame(anim);if(!document.getElementById('stage'))return;const t=(performance.now()-t0)/1000;
if(phase==='practice' && !referenceModel)return;
if(replayStart!==null && phase==='manual'){
  const fraction=Math.min(1,(performance.now()-replayStart)/1200);
  const smooth=fraction*fraction*(3-2*fraction);
  cur=A0().map((angle,i)=>angle+(((tgt[i]-angle+540)%360)-180)*smooth);
  if(fraction===1)replayStart=null;
}else if(tgt)cur=cur.map((c,i)=>c+(((tgt[i]-c+540)%360)-180)*.22);draw(cur,t)}

const BASE='https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/';
const M=[[11,13,0],[13,15,1],[12,14,2],[14,16,3],[23,25,4],[25,27,5],[24,26,6],[26,28,7]];
function msg(t){document.getElementById('msg').textContent=t}
function ld(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.append(s)})}
async function ensurePose(){if(pose)return;await poseLibrary();pose=new Pose({locateFile:f=>BASE+f});pose.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5});pose.onResults(onRes)}
async function startCam(){if(camOn)return;photoImg=null;msg('Starting camera…');
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('This view can’t use a camera. Try “Photo check”.');return}
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});vid.srcObject=stream;await vid.play()}catch(e){msg('Live camera is blocked in this view ('+(e.name||'error')+'). Use “Photo check” instead.');return}
try{await ensurePose();pose.setOptions({smoothLandmarks:true});camOn=true;msg('Tracking…');loop()}catch(e){msg('The pose model couldn’t load here. Use “I matched it”.')}}
async function loop(){if(!camOn)return;try{if(vid.readyState>=2)await pose.send({image:vid});requestAnimationFrame(loop)}catch(e){camOn=false;msg('Pose tracking stopped. Use “I matched it”.')}}
function rd(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
async function photo(f){if(!f)return;camOn=false;msg('Analyzing…');const img=new Image();img.src=await rd(f);await img.decode();photoImg=img;
try{await ensurePose();pose.setOptions({smoothLandmarks:false});await pose.send({image:img})}catch(e){msg('The pose model couldn’t load here. Use “I matched it”.')}}
function onRes(r){const im=photoImg,w=im?im.naturalWidth:vid.videoWidth,h=im?im.naturalHeight:vid.videoHeight;ov.width=w;ov.height=h;const c=ov.getContext('2d');c.clearRect(0,0,w,h);if(im)c.drawImage(im,0,0,w,h);const lm=r.poseLandmarks;
if(!lm){if(im)msg('No person found. Step back so your whole body is in frame.');upd(0);return}
c.strokeStyle='#22d3ee';c.lineWidth=Math.max(4,w/120);c.lineCap='round';M.forEach(([a,b])=>{if(lm[a].visibility>.4&&lm[b].visibility>.4){c.beginPath();c.moveTo(lm[a].x*w,lm[a].y*h);c.lineTo(lm[b].x*w,lm[b].y*h);c.stroke()}});
